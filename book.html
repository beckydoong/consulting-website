<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're in — pick your time | Rebecca.Builds</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#faf7f2;--ink:#1c1a17;--forest:#1f4d3a;--muted:#6b6459;--line:#e7e0d5}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 64px}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:18px}
  .eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--forest);margin-top:28px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2rem;line-height:1.1;margin:12px 0 0}
  p.lead{font-size:17px;line-height:1.6;color:var(--muted);margin:16px 0 0}
  #sess{font-weight:600;color:var(--ink)}
  .cal-card{margin-top:28px;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;min-height:640px}
  #my-cal-inline{width:100%;min-height:640px}
  .foot{margin-top:28px;font-size:13px;color:var(--muted)}
  .foot a{color:var(--forest)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Rebecca.Builds</div>
    <p class="eyebrow">Payment received</p>
    <h1>You're in. Let's get you booked.</h1>
    <p class="lead">Pick a time for your <span id="sess">session</span> below. You'll get a calendar invite with the video link, plus a short intake so I can prep before we meet.</p>
    <div class="cal-card"><div id="my-cal-inline"></div></div>
    <p class="foot">Trouble booking? Email <a href="mailto:hello@rebecca.builds">hello@rebecca.builds</a> and we'll sort it out.</p>
  </div>

<script type="text/javascript">
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");

  var params = new URLSearchParams(window.location.search);
  var s = (params.get("session") || "").toLowerCase();
  var map = {
    "quick-call": { link: "seedscale-agency/quick-call", label: "30-minute AI Strategy Call" },
    "ai-career": { link: "seedscale-agency/ai-career-strategy", label: "AI Career Strategy session" },
    "social": { link: "seedscale-agency/social-marketing-strategy", label: "Social & Marketing Strategy session" },
    "coaching": { link: "seedscale-agency/coaching-kickoff", label: "Coaching kickoff call" },
    "deep-dive": { link: "seedscale-agency/coaching-deep-dive", label: "90-minute Deep Dive" }
  };
  var chosen = map[s] || map["deep-dive"];
  document.getElementById("sess").textContent = chosen.label;

  Cal("init", { origin: "https://cal.com" });
  Cal("inline", { elementOrSelector: "#my-cal-inline", calLink: chosen.link, layout: "month_view" });
  Cal("ui", { hideEventTypeDetails: false, layout: "month_view" });
</script>
</body>
</html>
